<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Hongolandia</title>
  <meta name="theme-color" content="#272736">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hongolandia">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="juego"></canvas>

  <div id="hud">
    <div id="barra-bloque">
      <span class="hud-label">Esporas</span>
      <span id="esporas">0</span>
      <div id="barra-info"><span id="presti-nivel">Prestigio 0</span><span id="presti-num"></span></div>
      <div id="barra"><div id="barra-fill"></div></div>
    </div>
    <button id="btn-ajustes" aria-label="Ajustes">⚙</button>
  </div>
  <div id="dps" class="px" role="button" aria-label="Mostrar u ocultar el detalle de esporas por segundo">
    <div class="dps-titulo">Esporas/s</div>
    <div id="dps-filas" class="dps-lista"></div>
    <div class="dps-fila dps-total"><span>Total</span><b id="dps-total">0/s</b></div>
    <div class="dps-titulo dps-sub" id="dps-inv-titulo" hidden>Investigación</div>
    <div id="dps-inv" class="dps-lista"></div>
  </div>
  <div id="zoom"><button id="zoom-mas" aria-label="Acercar">+</button><button id="zoom-menos" aria-label="Alejar">−</button><button id="zoom-centro" aria-label="Centrar en el hongo madre">◎</button></div>
  <div id="toast"></div>
  <div id="hint">Tocá el hongo del medio</div>
  <div id="version" aria-hidden="true"></div>
  <div id="colocar"><span id="colocar-texto"></span><button id="colocar-cancelar" class="btn">Cancelar</button></div>

  <div id="fondo-hoja"></div>
  <section id="hoja" aria-live="polite">
    <header>
      <h2 id="hoja-titulo"></h2>
      <div class="hoja-btns">
        <button id="hoja-mover" aria-label="Mover o intercambiar de lugar" title="Mover / intercambiar" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true"><polyline points="22 3 22 9 16 9"/><polyline points="2 21 2 15 8 15"/><path d="M3.5 10a9 9 0 0 1 15-3.4L22 9M2 15l3.5 2.4A9 9 0 0 0 20.5 14"/></svg></button>
        <button id="hoja-cerrar" aria-label="Cerrar">✕</button>
      </div>
    </header>
    <div id="hoja-cuerpo"></div>
  </section>

  <script>window.APP_VERSION = "0.32.1"; document.getElementById("version").textContent = "v" + window.APP_VERSION;</script>
  <script src="vendor/break_eternity.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
