<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Hongolandia</title>
  <meta name="theme-color" content="#272736">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hongolandia">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="juego"></canvas>

  <div id="hud">
    <div id="barra-bloque">
      <span class="hud-label">Esporas</span>
      <span id="esporas">0</span>
      <div id="barra-info"><span id="presti-nivel">Prestigio 0</span><span id="presti-num"></span></div>
      <div id="barra"><div id="barra-fill"></div></div>
    </div>
    <button id="btn-ajustes" aria-label="Ajustes">⚙</button>
  </div>
  <div id="dps" class="px" role="button" aria-label="Mostrar u ocultar el detalle de esporas por segundo">
    <div class="dps-titulo">Esporas/s</div>
    <div id="dps-filas"></div>
    <div class="dps-fila dps-total"><span>Total</span><b id="dps-total">0/s</b></div>
  </div>
  <div id="hint">Tocá el hongo del medio</div>
  <div id="colocar"><span id="colocar-texto"></span><button id="colocar-cancelar" class="btn">Cancelar</button></div>

  <div id="fondo-hoja"></div>
  <section id="hoja" aria-live="polite">
    <header>
      <h2 id="hoja-titulo"></h2>
      <button id="hoja-cerrar" aria-label="Cerrar">✕</button>
    </header>
    <div id="hoja-cuerpo"></div>
  </section>

  <script>window.APP_VERSION = "0.15.0";</script>
  <script src="vendor/break_eternity.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
